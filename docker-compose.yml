services:
  postgres:
    image: postgres:18-alpine
    container_name: jobriq-postgres
    environment:
      POSTGRES_DB: jobriq
      POSTGRES_USER: jobriq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobriq -d jobriq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
